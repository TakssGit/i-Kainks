name: Aperçu de l’état actuel
on:
  push:
    branches: [codex/i-kainks-pro-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-preview-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/transactions.test.cjs
      - run: python3 scripts/build_preview.py "$RUNNER_TEMP/current-preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/current-preview
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
