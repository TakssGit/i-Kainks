name: Builds de test Android et Windows
on:
  push:
    branches: [codex/i-kainks-pro-v2]
    paths: ['lib/**', 'test/**', 'android/**', 'windows/**', 'pubspec.*', '.github/workflows/native-builds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Compiler APK de test
        if: matrix.target == 'android'
        run: flutter build apk --release
      - name: Compiler Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Conserver APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: i-kainks-android-test-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Conserver application Windows complète
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: i-kainks-windows-test-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
