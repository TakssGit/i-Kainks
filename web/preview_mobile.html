<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-Kaink's — Mobile en développement</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:#183c5d;font:14px Segoe UI,Arial,sans-serif}header{background:#14395e;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}button{background:#2174b2;border:0;border-radius:7px;color:white;padding:9px 13px;cursor:pointer}main{display:flex;justify-content:center;padding:14px}.phone{width:414px;max-width:100%;border:7px solid #253a4b;border-radius:32px;overflow:hidden;background:white;box-shadow:0 12px 28px #173b6033;height:min(830px,calc(100vh - 110px));min-height:500px}.phone iframe{width:100%;height:100%;border:0;background:white}small{color:#d1e4f3}@media(max-width:600px){header{padding:8px;flex-wrap:wrap}main{padding:4px}.phone{border-width:4px;border-radius:17px;height:calc(100dvh - 105px);min-height:400px}}</style></head><body><header><div><strong>▣ i-Kaink's — Aperçu mobile</strong><br><small>Simulation responsive Chrome • pas un APK Android</small></div><div><button onclick="document.querySelector('iframe').contentWindow.location.reload()">↻ Recharger</button> <span id="status">Prêt</span></div></header><main><div class="phone"><iframe title="i-Kaink's aperçu mobile" src="ik_dev_app.html?v=022"></iframe></div></main><script>let v='';setInterval(async()=>{try{const r=await fetch('ik_preview_version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=(await r.text()).trim();if(v&&v!==s){document.querySelector('iframe').contentWindow.location.reload();document.getElementById('status').textContent='Actualisé'}v=s}catch(e){document.getElementById('status').textContent='Serveur indisponible'}},2500)</script></body></html>
