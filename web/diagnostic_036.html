<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-Kaink's - Diagnostic 036</title><style>body{font:16px/1.6 system-ui,Arial;background:#f1f5f9;color:#10243c;margin:0;padding:24px}main{max-width:800px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 5px 30px #0012}h1{margin-top:0}a{color:#0953a6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f7;padding:12px;border-radius:8px}button{padding:10px;border:0;border-radius:8px;background:#113c70;color:white;cursor:pointer}</style></head><body><main><h1>i-Kaink's — Diagnostic PATCH 036</h1><p>Cette page teste les fichiers servis par votre application sans modifier les donnees.</p><p><a href="preview_pc.html">Ouvrir PC</a> | <a href="preview_mobile.html">Ouvrir Mobile</a></p><button id="run">Relancer les controles</button><pre id="result">Chargement...</pre></main><script>
async function test(){var names=['preview_pc.html','preview_mobile.html','ik_app_021.js','ik_schema.js','ik_database_029.js','ik_diagnostic_033.js','ik_premium_034.css','ik_premium_034.js','ik_health_036.js'];var rows=[];for(var name of names){try{var r=await fetch(name+'?t='+Date.now(),{cache:'no-store'});rows.push({file:name,status:r.status,contentType:r.headers.get('content-type'),bytes:(await r.text()).length});}catch(e){rows.push({file:name,error:String(e)})}}document.getElementById('result').textContent=JSON.stringify({url:location.href,results:rows},null,2)}document.getElementById('run').onclick=test;test();
