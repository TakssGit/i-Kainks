<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-Kaink's — Contrôle 060–063</title><style>body{font:15px system-ui;background:#101e36;color:#f4f7fc;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{color:#efc76c}.card{background:#1b3050;padding:18px;border-radius:14px;margin:14px 0}button{background:#efc76c;color:#17233c;border:0;border-radius:8px;padding:12px;margin:5px;cursor:pointer;font-weight:bold}pre{white-space:pre-wrap;word-break:break-word;background:#0e1a30;padding:14px;border-radius:8px}iframe{width:100%;height:440px;background:white;border:0;border-radius:10px}small{color:#b6c9e1}</style><main><h1>i-Kaink's · PACK 060–063</h1><p>Contrôle de l'interface et des bases locales — aucune donnée modifiée.</p><div class="card"><button id="run">Relancer l'audit</button><button id="save">Exporter le rapport JSON</button><p id="status">En attente</p><pre id="out"></pre></div><div class="card"><h2>Aperçu direct de l'application</h2><iframe id="appframe" src="ik_dev_app.html?audit060063=1" title="Application i-Kaink's"></iframe><small>L'aperçu est dans une iframe de même origine. Connectez-vous avec un compte de démonstration uniquement.</small></div></main><script>
let last={};const $=id=>document.getElementById(id);const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function audit(){const report={pack:'060-063',date:new Date().toISOString(),mode:'lecture seule',render:{},databases:[],warnings:[],files:{}};$('status').textContent='Audit en cours…';for(const f of ['ik_dev_app.html','preview_pc.html','preview_mobile.html','ik_schema.js','ik_app_021.js','ik_database_029.js','ik_core_048_051.js','ik_transactions_052_055.js','ik_security_056_059.js']){try{const r=await fetch(f,{method:'HEAD',cache:'no-store'});report.files[f]=r.status}catch(e){report.files[f]='ERREUR '+String(e)}}await wait(700);try{const d=$('appframe').contentDocument;report.render={iframeAccessible:!!d,bodyCharacters:(d?.body?.innerText||'').length,loginPresent:!!d?.getElementById('login'),appPresent:!!d?.getElementById('app'),navigationPresent:!!d?.getElementById('nav'),contentPresent:!!d?.getElementById('content'),title:d?.title||''};if(!report.render.bodyCharacters)report.warnings.push('Contenu iframe vide : vérifier la console Chrome')}catch(e){report.warnings.push('Inspection iframe impossible : '+String(e))}if(!indexedDB.databases){report.warnings.push('indexedDB.databases indisponible : aucune base ouverte pour éviter une création involontaire')}else{try{const dbs=await indexedDB.databases();for(const entry of dbs){if(!entry.name)continue;const info={name:entry.name,version:entry.version,stores:[],error:null};try{const db=await new Promise((resolve,reject)=>{const req=indexedDB.open(entry.name);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Base bloquée'))});for(const name of Array.from(db.objectStoreNames)){const storeInfo={name};try{const tx=db.transaction(name,'readonly'),store=tx.objectStore(name);storeInfo.keyPath=store.keyPath;storeInfo.autoIncrement=store.autoIncrement;storeInfo.indexes=Array.from(store.indexNames);storeInfo.count=await new Promise((resolve,reject)=>{const q=store.count();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}catch(e){storeInfo.error=String(e)}info.stores.push(storeInfo)}db.close()}catch(e){info.error=String(e)}report.databases.push(info)}}catch(e){report.warnings.push('Énumération IndexedDB impossible : '+String(e))}}last=report;$('out').textContent=JSON.stringify(report,null,2);$('status').textContent='Audit terminé — exporter le JSON et joindre au rapport développeurs.'}
$('run').onclick=audit;$('save').onclick=()=>{if(!last.date)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AUDIT_NAVIGATEUR_060_063.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};window.addEventListener('load',audit);
</script></html>
